name: CI
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v3
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
              node-version: '18'
        - name: Install dependencies
          run: npm install
        - name: Start server and verify endpoints
          run: |
              node server.js &
              SERVER_PID=$!
              sleep 2
              curl -sf http://localhost:3000/api/stream-info | jq -e '.match.status == "LIVE"'
              curl -sf http://localhost:3000/api/scorecard | jq -e '.scorecard.innings | length > 0'
              curl -sf http://localhost:3000/api/viewers | jq -e '.viewers | type == "number"'
              curl -sf http://localhost:3000/api/chat | jq -e '.messages | type == "array"'
              curl -sf -X POST http://localhost:3000/api/chat \
                -H 'Content-Type: application/json' \
                -d '{"username":"TestUser","message":"CI check"}' | jq -e '.message.id | type == "number"'
              kill $SERVER_PID
          env:
              PORT: 3000
